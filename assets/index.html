<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>wado — control</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #111; color: #ddd;
      font-family: system-ui, sans-serif; }
    body { display: flex; }
    #panel { width: 320px; flex: 0 0 320px; padding: 16px; box-sizing: border-box;
      background: #181818; border-right: 1px solid #2a2a2a; overflow-y: auto; }
    #stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .hint { font-size: 12px; color: #888; margin: 0 0 16px; }
    label { display: block; font-size: 12px; color: #aaa; margin: 12px 0 4px; }
    select, input[type=text], input[type=number] { width: 100%; box-sizing: border-box;
      background: #222; color: #eee; border: 1px solid #333; border-radius: 4px;
      padding: 6px 8px; font-size: 14px; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    details { margin-top: 12px; border-top: 1px solid #2a2a2a; padding-top: 8px; }
    summary { cursor: pointer; font-size: 13px; color: #aaa; }
    .btns { margin-top: 16px; display: flex; gap: 8px; }
    button { flex: 1; border: 0; border-radius: 4px; padding: 9px; font-size: 14px;
      cursor: pointer; color: #fff; }
    #start { background: #2a7; } #stop { background: #a33; }
    button:disabled { background: #444; color: #888; cursor: default; }
    #status { font-size: 12px; color: #8c8; margin-top: 12px; min-height: 1em; }
    #stagebar { padding: 6px 12px; font-size: 12px; color: #888; background: #151515; }
    #video { flex: 1; width: 100%; min-height: 0; object-fit: contain; background: #000; }
    /* Live log panel */
    #logs { border-top: 1px solid #2a2a2a; background: #0d0d0d; }
    #logs > summary { padding: 6px 12px; user-select: none; }
    #logwrap { height: 200px; overflow-y: auto; padding: 4px 12px 8px;
      font-family: ui-monospace, monospace; font-size: 11.5px; line-height: 1.45; }
    .logline { white-space: pre-wrap; word-break: break-word; }
    .lts { color: #666; }
    .l-ERROR { color: #f66; } .l-WARN { color: #fd6; }
    .l-INFO { color: #9c9; } .l-DEBUG, .l-TRACE { color: #789; }
  </style>
</head>
<body>
  <div id="panel">
    <h1>wado</h1>
    <p class="hint">Configure and start a streaming session.</p>

    <label>Resolution</label>
    <select id="res">
      <option value="1280x720" selected>1280 × 720 (720p)</option>
      <option value="1920x1080">1920 × 1080 (1080p)</option>
      <option value="1080x2400">1080 × 2400 (phone portrait)</option>
      <option value="2400x1080">2400 × 1080 (phone landscape)</option>
      <option value="custom">Custom…</option>
    </select>
    <div class="row" id="customRes" style="display:none; margin-top:8px;">
      <input type="number" id="resW" placeholder="width" value="1280" min="16" step="2" />
      <input type="number" id="resH" placeholder="height" value="720" min="16" step="2" />
    </div>

    <label>FPS</label>
    <select id="fps">
      <option value="30">30</option>
      <option value="60" selected>60</option>
      <option value="120">120</option>
    </select>

    <label>Quality</label>
    <select id="quality">
      <option value="reactivity">Optimize reactivity (low latency)</option>
      <option value="balanced" selected>Balanced</option>
      <option value="quality">Optimize image quality</option>
      <option value="custom">Custom bitrate…</option>
    </select>
    <div id="customQ" style="display:none; margin-top:8px;">
      <label style="margin-top:0;">Bitrate: <span id="brLabel">4000</span> kbps</label>
      <input type="range" id="bitrate" min="500" max="20000" step="500" value="4000" style="width:100%;" />
    </div>

    <label>Application to launch</label>
    <input type="text" id="command" value="weston-terminal"
      placeholder="e.g. mpv --fullscreen video.mp4" />

    <details>
      <summary>Advanced</summary>
      <label>x264 preset</label>
      <select id="preset">
        <option value="">(from quality)</option>
        <option value="ultrafast">ultrafast</option>
        <option value="superfast">superfast</option>
        <option value="veryfast">veryfast</option>
        <option value="faster">faster</option>
      </select>
      <label>Keyframe interval (frames)</label>
      <input type="number" id="kf" placeholder="(from quality)" min="1" />
    </details>

    <div class="btns">
      <button id="start">Start</button>
      <button id="stop" disabled>Stop</button>
    </div>
    <div id="status">idle</div>
  </div>

  <div id="stage">
    <div id="stagebar">No session.</div>
    <video id="video" autoplay playsinline muted></video>
    <details id="logs">
      <summary>Logs</summary>
      <div id="logwrap"></div>
    </details>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const statusEl = $("status"), stagebar = $("stagebar"), videoEl = $("video");
    const startBtn = $("start"), stopBtn = $("stop");
    const logwrap = $("logwrap"), logsPanel = $("logs");

    let pc = null;
    let reconnectAttempts = 0;
    const MAX_RECONNECTS = 3;
    let sessionOn = false;

    function setStatus(s) { statusEl.textContent = s; }

    // ── live logs (SSE) ──────────────────────────────────────────────────────
    function addLog(line) {
      // wire format: LEVEL|HH:MM:SS|text
      const i1 = line.indexOf("|"), i2 = line.indexOf("|", i1 + 1);
      let level = "INFO", ts = "", text = line;
      if (i1 > 0 && i2 > i1) { level = line.slice(0, i1); ts = line.slice(i1 + 1, i2); text = line.slice(i2 + 1); }
      const div = document.createElement("div");
      div.className = "logline l-" + level.trim();
      div.innerHTML = `<span class="lts">${ts}</span> ${escapeHtml(text)}`;
      const atBottom = logwrap.scrollHeight - logwrap.scrollTop - logwrap.clientHeight < 30;
      logwrap.appendChild(div);
      while (logwrap.childElementCount > 500) logwrap.removeChild(logwrap.firstChild);
      if (atBottom) logwrap.scrollTop = logwrap.scrollHeight;
    }
    function escapeHtml(s) {
      return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
    }
    function connectLogs() {
      const es = new EventSource("/events");
      es.onmessage = (ev) => addLog(ev.data);
      es.onerror = () => { /* EventSource auto-reconnects */ };
    }

    // ── form → config ────────────────────────────────────────────────────────
    $("res").addEventListener("change", (e) => {
      $("customRes").style.display = e.target.value === "custom" ? "flex" : "none";
    });
    $("quality").addEventListener("change", (e) => {
      $("customQ").style.display = e.target.value === "custom" ? "block" : "none";
    });
    $("bitrate").addEventListener("input", (e) => { $("brLabel").textContent = e.target.value; });

    function buildConfig() {
      let w, h;
      if ($("res").value === "custom") {
        w = parseInt($("resW").value, 10); h = parseInt($("resH").value, 10);
      } else {
        [w, h] = $("res").value.split("x").map((n) => parseInt(n, 10));
      }
      const q = $("quality").value;
      const quality = q === "custom"
        ? { custom: { bitrate_kbps: parseInt($("bitrate").value, 10) } }
        : q;
      const cfg = { width: w, height: h, fps: parseInt($("fps").value, 10), quality, command: $("command").value };
      if ($("preset").value) cfg.preset = $("preset").value;
      if ($("kf").value) cfg.keyframe_interval = parseInt($("kf").value, 10);
      return cfg;
    }

    // ── lifecycle ────────────────────────────────────────────────────────────
    async function start() {
      startBtn.disabled = true;
      setStatus("starting session…");
      try {
        const res = await fetch("/session/start", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(buildConfig()),
        });
        if (!res.ok) { setStatus("start failed: " + (await res.text())); startBtn.disabled = false; return; }
        sessionOn = true;
        reconnectAttempts = 0;
        stagebar.textContent = "Session running — connecting video…";
        await connectWebRTC();
        stopBtn.disabled = false;
      } catch (e) {
        setStatus("error: " + e.message);
        logsPanel.open = true;
        onStopped();
      }
    }

    // Build a fresh peer connection + offer. The server makes a new pc per offer,
    // so reconnection is a full re-offer (not an ICE restart on the same pc).
    async function connectWebRTC() {
      if (pc) { try { pc.close(); } catch (_) {} }
      pc = new RTCPeerConnection();
      pc.addTransceiver("video", { direction: "recvonly" });
      pc.ontrack = (ev) => {
        videoEl.srcObject = ev.streams[0];
        stagebar.textContent = "Streaming.";
        reconnectAttempts = 0;
      };
      pc.oniceconnectionstatechange = () => setStatus("ICE: " + pc.iceConnectionState);
      pc.onconnectionstatechange = () => {
        // Only `failed` is terminal. `disconnected` is transient and usually
        // recovers on its own, so we never tear down on it.
        if (pc && pc.connectionState === "failed") handleFailure();
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await new Promise((resolve) => {
        if (pc.iceGatheringState === "complete") return resolve();
        const check = () => {
          if (pc.iceGatheringState === "complete") { pc.removeEventListener("icegatheringstatechange", check); resolve(); }
        };
        pc.addEventListener("icegatheringstatechange", check);
      });

      const resp = await fetch("/offer", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(pc.localDescription),
      });
      if (!resp.ok) throw new Error("offer rejected: HTTP " + resp.status);
      await pc.setRemoteDescription(await resp.json());
      setStatus("connected");
    }

    // Retry the WebRTC connection with backoff; the compositor session keeps running.
    function handleFailure() {
      if (!sessionOn) return;
      if (reconnectAttempts >= MAX_RECONNECTS) {
        setStatus("connection lost — giving up");
        logsPanel.open = true;
        stop();
        return;
      }
      reconnectAttempts++;
      const delay = 500 * Math.pow(2, reconnectAttempts - 1);
      setStatus(`connection lost — reconnecting (${reconnectAttempts}/${MAX_RECONNECTS})…`);
      setTimeout(() => {
        if (!sessionOn) return;
        connectWebRTC().catch(() => handleFailure());
      }, delay);
    }

    async function stop() {
      stopBtn.disabled = true;
      sessionOn = false;
      try { await fetch("/session/stop", { method: "POST" }); } catch (_) {}
      onStopped();
    }

    function onStopped() {
      sessionOn = false;
      if (pc) { try { pc.close(); } catch (_) {} pc = null; }
      videoEl.srcObject = null;
      stagebar.textContent = "No session.";
      setStatus("idle");
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }

    startBtn.addEventListener("click", start);
    stopBtn.addEventListener("click", stop);
    // Free server resources promptly if the tab is closed mid-session.
    window.addEventListener("pagehide", () => {
      if (sessionOn) navigator.sendBeacon("/session/stop");
    });

    connectLogs();
  </script>
</body>
</html>
