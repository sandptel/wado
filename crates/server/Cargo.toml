[package]
name = "wado"
version = "0.0.3"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
wado-protocol = { path = "../protocol" }
wado-config = { path = "../config" }
# The compositor library. The server drives it only through the typed command/frame
# boundary it exposes (build / CompositorCommand / FrameMsg) — no Smithay here.
wado-compositor = { path = "../compositor" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
# WebRTC video transport. Pinned to the 0.17.x stable line — 0.20.0-alpha.1 is the
# Sans-IO migration and must NOT be used (see WADO_PLAN.md §3.4 Gotchas).
webrtc = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "io-util", "time", "macros", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
# WebSocket client used by the relay client to connect to wado-relay.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
# Remote ID generation (already in the dep tree via webrtc).
rand = "0.8"
portable-pty = "0.9.0"
# Opus for the audio track (`audio/`). The same binding and version the compositor's video
# encoder already links, so it costs no new build and no new system library.
ffmpeg-the-third = "5.0.0"
# PR_SET_PDEATHSIG for the helpers that must die with the daemon (`host/`).
libc = "0.2"
# Local cover art (`file://`) goes to the viewer as a data: URI (`host/media.rs`). Already in the tree.
base64 = "0.22"
# The connect QR code `wado qr` prints in the terminal. No image output, so no image deps.
qrcode = { version = "0.14", default-features = false }
# The end-to-end envelope over the relay (`e2e/`): Ed25519, X25519, HKDF, AES-GCM, HMAC.
# Already in the tree via webrtc/rustls, so no new crate.
ring = "0.17"
zbus = { version = "5", default-features = false, features = ["tokio"] }
