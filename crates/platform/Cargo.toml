[package]
name = "wado-platform"
version = "0.0.3"
edition = "2024"
license = "AGPL-3.0-only"
description = "wado's platform layer: every host capability (input devices, sound, Wi-Fi, clipboard, windows, …) as a trait, a registry that says honestly what is missing, published state, and fakes. No Smithay, no network types."

[features]
# Fakes for every capability, and the contract every provider must pass. On for this crate's own
# tests; other crates turn it on in their dev-dependencies.
fake = []

[dependencies]
# Wire types the capabilities speak (HostAudio, Wifi, Player, ClipEntry, Capability, …).
wado-protocol = { path = "../protocol" }
# `watch` for published state, `mpsc` for the PTY's output lane, `Mutex` for coalesced refresh.
# Only `sync`: no runtime runs in this crate.
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "test-util"] }
