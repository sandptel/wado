[package]
name = "wado-compositor"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "wado's headless Smithay compositor: Wayland protocol state, GLES render pipeline, software (x264) + hardware (VAAPI via ffmpeg) H.264 encode behind one trait, and the typed command/frame boundary the server drives it through."

[dependencies]
wado-protocol = { path = "../protocol" }
tracing = "0.1"
thiserror = "1"
bitflags = "2"
x264 = "0.5"
# Hardware encode (M3): VAAPI/NVENC via ffmpeg. Pinned to the FFmpeg-8.1-compatible
# release so it links the system libav* (8.1) in the dev shell. All ffmpeg FFI is
# isolated under `encode/ffmpeg/` behind the `VideoEncoder` trait.
ffmpeg-the-third = "5.0.0"
bytes = "1"
# killpg(2). Already in the tree via tokio and smithay, so this costs no build time — the
# stdlib can kill a pid but has no way to signal a process *group*, which is the whole
# point of `proc.rs`.
libc = "0.2"
# calloop is smithay's event loop, re-exported; naming it here only turns on `signals`,
# which Cargo then unifies onto the same build. Without it a SIGINT/SIGTERM kills the
# daemon outright and `stop_session` never runs — see `proc.rs`.
calloop = { version = "0.14", features = ["signals"] }
# Only the `sync` channel types (mpsc/oneshot) used on the server<->compositor
# boundary — no tokio runtime runs in this crate.
tokio = { version = "1", features = ["sync"] }

[dependencies.smithay]
git = "https://github.com/Smithay/smithay.git"
default-features = false
features = [
    "renderer_gl",
    "wayland_frontend",
    "desktop",
    # M3 Step 2: DMA-BUF zero-copy capture. `backend_gbm` pulls `backend_drm` + `gbm` +
    # `drm` — the GBM allocator (dmabuf allocation) and an EGL display initialised from the
    # GBM device (so `GlesRenderer` can `Bind<Dmabuf>`). Dev shell provides gbm + libdrm.
    "backend_gbm",
]

[dev-dependencies]
# The signal-shutdown test checks process groups directly.
libc = "0.2"
# The standalone render examples set up their own console tracing subscriber.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
