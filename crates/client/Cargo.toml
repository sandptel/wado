[package]
name = "wado-client"
version = "0.0.2"
edition = "2021"
license = "AGPL-3.0-only"
description = "wado web client — a Dioxus (WASM) app that configures, starts, and views a wado streaming session."

[dependencies]
# Web (WASM) target. Native desktop/mobile can be added later from the same code.
dioxus = { version = "0.7", features = ["web"] }
wado-protocol = { path = "../protocol" }
serde = "1"
serde_json = "1"
# Readable panics in the browser console during development.
console_error_panic_hook = "0.1"

# Pinned EXACTLY, and it must match the wasm-bindgen-cli that `dx` ships, or the build
# fails with "Incorrect wasm-bindgen-cli version". Bump this in lockstep with dioxus-cli:
# dioxus-cli 0.7.10 -> 0.2.126 (0.7.9 was 0.2.118).
wasm-bindgen = "=0.2.126"
