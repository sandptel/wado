name: wado
description: "wado — your computer, from your phone. The native app (Flutter over the Rust client core)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.8
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.2
  flutter_webrtc: ^1.6.3
  flutter_zxing: ^3.1.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  xterm: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/schemes.json
    - assets/os/
  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
