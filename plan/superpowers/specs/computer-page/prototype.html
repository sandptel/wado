<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>wado — Computer page prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" />
<style>
/* ── tokens: DESIGN.md / assets/base.css, verbatim ─────────────────────────────────────── */
:root {
  --base00:#181818; --base01:#282828; --base02:#383838; --base03:#585858;
  --base04:#b8b8b8; --base05:#d8d8d8; --base06:#e8e8e8; --base07:#f8f8f8;
  --base08:#ab4642; --base09:#dc9656; --base0A:#f7ca88; --base0B:#a1b56c;
  --base0C:#86c1b9; --base0D:#7cafc2; --base0E:#ba8baf; --base0F:#a16946;
  color-scheme: dark;
}
/* One light scheme: catppuccin-latte, from crates/client/src/schemes.json. */
:root[data-theme="light"] {
  --base00:#eff1f5; --base01:#e6e9ef; --base02:#ccd0da; --base03:#bcc0cc;
  --base04:#acb0be; --base05:#4c4f69; --base06:#dc8a78; --base07:#7287fd;
  --base08:#d20f39; --base09:#fe640b; --base0A:#df8e1d; --base0B:#40a02b;
  --base0C:#179299; --base0D:#1e66f5; --base0E:#8839ef; --base0F:#dd7878;
  color-scheme: light;
}
:root {
  --s0: var(--base00);
  --s1: color-mix(in oklab, var(--base00), var(--base05) 6%);
  --s2: color-mix(in oklab, var(--base00), var(--base05) 11%);
  --s3: color-mix(in oklab, var(--base00), var(--base05) 18%);
  --line: color-mix(in oklab, var(--base00), var(--base05) 14%);
  --bright: var(--base05);
  --text: color-mix(in oklab, var(--base05), var(--base00) 10%);
  --dim: color-mix(in oklab, var(--base05), var(--base00) 42%);
  --accent: var(--base0D); --on-accent: var(--base00);
  --good: var(--base0B); --warn: var(--base09); --bad: var(--base08); --caution: var(--base0A);
  --r1:10px; --r2:16px; --r3:22px; --r4:28px; --gap:10px;
  --display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body: "Figtree", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  /* The two curves (unchanged) … */
  --spring: cubic-bezier(.32, .72, 0, 1);
  --pop: cubic-bezier(.34, 1.56, .64, 1);
  --ease: var(--spring);
  --dur: 220ms; --dur-sheet: 480ms;
  /* … and the proposed extension (design-spec.md §4.1): durations and a stagger step, no new curve. */
  --dur-hero: 520ms;      /* card → Computer page shared element */
  --dur-press: 120ms;
  --stagger: 40ms;
}
:root[data-motion="reduced"] { --dur: 120ms; --dur-sheet: 200ms; --dur-hero: 160ms; --stagger: 0ms; --pop: var(--spring); }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--s0); color: var(--text); font: 14px/1.45 var(--body);
  overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
body { overflow: hidden; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.fill { fill: currentColor; stroke: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0;
  transition: scale var(--dur-press) var(--ease), background var(--dur) var(--ease), color var(--dur) var(--ease), opacity var(--dur) var(--ease); }
button:active:not(:disabled) { scale: .96; }
button:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); }

/* ── screens ───────────────────────────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.screen::-webkit-scrollbar { display: none; }
#home { z-index: 10; padding: calc(40px + env(safe-area-inset-top)) max(16px, calc((100% - 460px) / 2)) calc(32px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 12px;
  background:
    radial-gradient(90% 40% at 50% 0%, color-mix(in oklab, var(--accent), transparent 82%), transparent 70%),
    radial-gradient(60% 30% at 100% 100%, color-mix(in oklab, var(--base0E), transparent 90%), transparent 70%),
    var(--s0);
  transform-origin: 50% 30%; }
#home > * { flex-shrink: 0; min-width: 0; }
#computer { z-index: 20; visibility: hidden; transform-origin: 50% 0; }
#computer.on { visibility: visible; }
#computer .cground { position: fixed; inset: 0; background: var(--s0); z-index: 0; }
#computer .cground::before { content: ""; position: absolute; inset: 0;
  background: radial-gradient(80% 36% at 30% 0%, color-mix(in oklab, var(--hue), transparent 86%), transparent 70%); }
#sub { z-index: 30; visibility: hidden; background: var(--s0); }
#sub.on { visibility: visible; }

/* ── shared pieces (reused from cc.css / landing.css) ─────────────────────────────────── */
.wordmark { font: 700 clamp(42px, 12vw, 64px)/1 var(--display); color: var(--bright); letter-spacing: -.045em; }
.wordmark span { color: var(--accent); }
.tag { margin: -4px 0 6px; color: var(--dim); }
.sect { display: flex; justify-content: space-between; align-items: center; margin: 8px 4px -2px; min-height: 32px;
  font: 600 11px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.sect button { color: var(--accent); letter-spacing: .02em; text-transform: none; font-size: 14px; font-weight: 600; min-height: 44px; padding: 0 6px; margin-right: -6px; }
.disc { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; --hue: var(--accent);
  color: var(--hue); background: color-mix(in oklab, var(--hue), transparent 84%); }
.list { border-radius: var(--r3); background: var(--s1); overflow: hidden; }
.navrow { width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 14px; text-align: left; min-height: 60px; }
.navrow:hover { background: var(--s2); }
.navrow + .navrow { border-top: 1px solid color-mix(in oklab, var(--line), transparent 40%); }
.navrow > svg:last-child { margin-left: auto; color: var(--dim); }
.navtext { min-width: 0; flex: 1; }
.navtext b { display: block; font-weight: 600; color: var(--bright); }
.navtext small { display: block; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { min-height: 48px; padding: 0 16px; border-radius: var(--r2); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--s2); color: var(--bright); width: 100%; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.danger { background: color-mix(in oklab, var(--bad), transparent 82%); color: var(--bad); }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; display: inline-grid; place-items: center; color: var(--dim); flex: none; }
.iconbtn:hover { background: var(--s2); color: var(--bright); }
.card { border-radius: var(--r3); background: var(--s1); padding: 14px; display: grid; gap: 10px; }
.cardhead { font-weight: 600; color: var(--bright); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.why { font-size: 12px; color: var(--dim); margin: 0; }
.why.host { color: var(--caution); }
.whenbadge { font: 600 9.5px var(--body); letter-spacing: .08em; text-transform: uppercase; padding: 3px 7px; border-radius: 999px; margin-left: 2px; }
.whenbadge.apply { color: var(--accent); background: color-mix(in oklab, var(--accent), transparent 86%); }
.whenbadge.host { color: var(--base0E); background: color-mix(in oklab, var(--base0E), transparent 86%); }
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; border-radius: var(--r2); background: var(--s0); }
.seg .knob { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / var(--n));
  translate: calc(100% * var(--i)) 0; border-radius: calc(var(--r2) - 4px); background: var(--accent); transition: translate 420ms var(--spring); }
.seg button { position: relative; z-index: 1; min-height: 40px; border-radius: calc(var(--r2) - 4px); font-weight: 600; font-size: 13px; color: var(--dim); }
.seg button.on { color: var(--on-accent); }
.switchrow { display: flex; align-items: center; gap: 10px; min-height: 48px; width: 100%; text-align: left; }
.swtext { flex: 1; min-width: 0; } .swtext b { color: var(--bright); font-weight: 600; display: block; } .swtext small { display: block; font-size: 12px; color: var(--dim); }
.sw { width: 52px; height: 32px; border-radius: 999px; background: var(--s3); position: relative; flex: none; transition: background var(--dur) var(--ease); }
.sw::after { content: ""; position: absolute; top: 8px; left: 8px; width: 16px; height: 16px; border-radius: 50%; background: var(--dim);
  transition: left 340ms var(--pop), top 340ms var(--pop), width 340ms var(--pop), height 340ms var(--pop), background var(--dur); }
.sw.on { background: var(--accent); } .sw.on::after { left: 24px; top: 4px; width: 24px; height: 24px; background: var(--on-accent); }

/* ── HOME: computer cards ─────────────────────────────────────────────────────────────── */
.ccards { display: grid; gap: 8px; }
.ccard { position: relative; display: flex; align-items: center; gap: 4px; border-radius: var(--r3); background: var(--s1);
  border: 1px solid var(--line); padding: 6px 8px 6px 6px; min-height: 80px; transition: scale var(--dur-press) var(--ease); }
.ccard:has(.cpick:active) { scale: .98; }
.cpick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left; min-height: 66px; padding-left: 8px; border-radius: var(--r2); }
.cpick:active:not(:disabled) { scale: 1; }
.cpick .disc { width: 46px; height: 46px; }
.ctext { min-width: 0; display: grid; gap: 1px; }
.cname { font: 700 17px/1.15 var(--display); color: var(--bright); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transform-origin: 0 0; justify-self: start; }
.cos { font: 11.5px var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cline { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); margin-top: 3px; white-space: nowrap; }
.cgo { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--accent);
  background: color-mix(in oklab, var(--accent), transparent 82%); transition: scale var(--dur-press) var(--ease), background var(--dur) var(--ease); }
.cgo svg { width: 18px; height: 18px; margin-left: 2px; }
.cgo.live { background: var(--accent); color: var(--on-accent); box-shadow: 0 8px 22px -10px color-mix(in oklab, var(--accent), transparent 30%); }
.cgo:active:not(:disabled) { scale: .9; }
.cgo:disabled { background: var(--s2); color: var(--dim); box-shadow: none; opacity: 1; }
.ccard.add { justify-content: center; gap: 8px; color: var(--dim); background: none; border: 1.5px dashed var(--line); min-height: 52px; font-weight: 600; width: 100%; }

/* Link state: dot + words, tone from the truth. The dot moves only while something is alive. */
.lstate { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--tone); --tone: var(--dim); white-space: nowrap; }
.lstate.ok { --tone: var(--good); } .lstate.warn { --tone: var(--caution); } .lstate.bad { --tone: var(--bad); }
.ldot { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--tone); flex: none; }
.ldot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--tone); opacity: 0; }
.lstate.ok .ldot::after { animation: ripple 2s cubic-bezier(.2, 0, 0, 1) infinite; }   /* paced to the ping sample */
.lstate.warn .ldot { animation: breathe 2.4s ease-in-out infinite; }
@keyframes ripple { 0% { opacity: .55; scale: 1; } 45%, 100% { opacity: 0; scale: 2.8; } }
@keyframes breathe { 50% { opacity: .35; } }
.ms { display: inline-block; font-variant-numeric: tabular-nums; }
.ms.roll { animation: roll 260ms var(--spring); }
@keyframes roll { from { translate: 0 60%; opacity: 0; } }

/* Running sessions (sessioncard, reused). */
.sessioncard { display: grid; gap: 10px; padding: 14px; border-radius: var(--r3); background: var(--s1); border: 1px solid color-mix(in oklab, var(--good), transparent 60%); }
.sessionhead { display: flex; align-items: center; gap: 12px; min-width: 0; }
.sessionshape { width: 54px; height: 54px; flex: none; display: grid; place-items: center; border-radius: var(--r2); background: var(--s0); }
.sessionshape span { display: block; border-radius: 5px; border: 2px solid var(--good); background: color-mix(in oklab, var(--good), transparent 82%); }
.appchip { padding: 3px 10px; border-radius: 999px; background: var(--s2); color: var(--text); font-size: 12px; }
.sessionapps { display: flex; flex-wrap: wrap; gap: 6px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.hostchip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text); }
.hostchip i { width: 8px; height: 8px; border-radius: 50%; background: var(--hue); }

/* ── HOME: widgets ────────────────────────────────────────────────────────────────────── */
.wlist { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; position: relative; }
.widget { position: relative; min-width: 0; border-radius: var(--r3); background: var(--s1); padding: 12px 14px 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px;
  transition: scale var(--dur-press) var(--ease), opacity var(--dur) var(--ease), border-radius 360ms var(--spring); touch-action: pan-y; }
.whead { display: flex; align-items: center; gap: 8px; min-height: 28px; }
.whead > svg { width: 16px; height: 16px; color: var(--dim); }
.whead .wtitle { font: 600 11px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.whead .wfor { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text);
  min-height: 28px; padding: 0 10px 0 8px; border-radius: 999px; background: var(--s2); }
.whead .wfor .ldot { width: 7px; height: 7px; }
.wbody { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; }
.widget.away .wbody { opacity: .55; }
.wnote { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text); }
.wnote b { color: var(--bad); font-weight: 600; }

/* edit-mode chrome: hidden until .editing */
.wlist:not(.editing) .wedit { display: none !important; }
.wlist.editing .wbody { display: none; }
.wlist.editing .widget { padding: 8px 6px 8px 8px; grid-template-columns: 1fr; }
.wlist.editing .whead { min-height: 48px; gap: 6px; }
.wlist.editing .whead > svg { display: none; }
.wrm { width: 44px; height: 44px; display: grid; place-items: center; flex: none; margin-right: -4px; }
.wrm span { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in oklab, var(--bad), transparent 80%); color: var(--bad); }
.wrm svg { width: 15px; height: 15px; stroke-width: 2.6; }
.wlist.editing .wrm span { animation: popin 360ms var(--pop) both; animation-delay: calc(var(--k, 0) * 30ms); }
@keyframes popin { from { scale: 0; } }
.wico { width: 38px; height: 38px; border-radius: var(--r2); display: grid; place-items: center; background: var(--s2); color: var(--bright); flex: none; }
.wlist.editing .wtitle { font: 600 14px var(--body); letter-spacing: 0; text-transform: none; color: var(--bright); }
.wlist.editing .wname { display: grid; gap: 0; min-width: 0; }
.wlist.editing .wfor { margin-left: 0; background: none; padding: 0; min-height: 22px; color: var(--accent); justify-self: start; }
.wlist.editing .wfor::after { content: ""; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; rotate: 45deg; translate: 0 -2px; margin-left: 2px; }
.wname { display: contents; }
.wmove { margin-left: auto; display: flex; align-items: center; }
.wmove .iconbtn { width: 38px; height: 44px; border-radius: var(--r1); }
.wmove .iconbtn svg { width: 18px; height: 18px; }
.grip { width: 44px; height: 48px; display: grid; place-items: center; color: var(--dim); cursor: grab; touch-action: none; border-radius: var(--r1); }
.wlist.editing .wmove { animation: slidein 420ms var(--spring) both; animation-delay: calc(var(--k, 0) * 30ms); }
@keyframes slidein { from { translate: 24px 0; opacity: 0; } }
.widget.lifted { z-index: 5; scale: 1.03; background: var(--s2); box-shadow: 0 18px 50px -20px #000a; transition: scale 200ms var(--pop), box-shadow 200ms var(--ease); }
.widget.lifted .grip { cursor: grabbing; color: var(--accent); }
.widget.shift { transition: translate 300ms var(--spring); }
.widget.settle { transition: translate 340ms var(--pop), scale 260ms var(--spring), box-shadow 260ms var(--ease); }
.widget.leaving { scale: .9; opacity: 0; transition: scale 180ms cubic-bezier(.3,0,1,1), opacity 180ms linear; pointer-events: none; }
.wtray { display: none; }
.wlist.editing ~ .wtray { display: grid; gap: 8px; animation: rise 420ms var(--spring) both 80ms; }
.wtray .traygrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.wadd { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 12px; border-radius: var(--r2); border: 1.5px dashed var(--line);
  color: var(--text); font-weight: 600; font-size: 13px; }
.wadd svg { width: 18px; height: 18px; color: var(--accent); }
.edithint { font-size: 12px; color: var(--dim); margin: 0 4px; }
.wlist.editing ~ .edithint { display: block; } .edithint { display: none; }
@keyframes rise { from { opacity: 0; translate: 0 14px; } }

/* widget bodies */
.wmedia { display: flex; align-items: center; gap: 12px; min-width: 0; }
.wmedia .cover { width: 52px; height: 52px; border-radius: var(--r1); flex: none; background-size: cover; box-shadow: 0 4px 14px rgb(0 0 0 / .25); }
.wmedia .mt { flex: 1; min-width: 0; display: grid; }
.wmedia .mt b { font: 700 16px/1.2 var(--display); color: var(--bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wmedia .mt span { font-size: 12.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wmedia .iconbtn { color: var(--bright); }
.wmedia .play { background: var(--accent); color: var(--on-accent); }
.thinbar { height: 4px; border-radius: 2px; background: var(--s3); overflow: hidden; }
.thinbar i { display: block; height: 100%; width: 100%; background: var(--bright); transform-origin: 0 50%; scale: var(--p) 1; border-radius: 2px; }
.clipsw { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.clipw { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 12px; border-radius: var(--r2); background: var(--s0); min-height: 48px; }
.clipw .ct { flex: 1; min-width: 0; font: 12px var(--mono); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clipw svg.pin { width: 14px; height: 14px; color: var(--caution); }
.clipw .iconbtn { width: 40px; height: 40px; }
.clipw .iconbtn svg { width: 18px; height: 18px; }
.clipw.copied { background: color-mix(in oklab, var(--good), var(--s0) 82%); }
.padw { position: relative; height: 104px; border-radius: var(--r2); background: var(--s0); border: 1px solid var(--line); display: grid; place-items: center;
  color: var(--dim); font-size: 13px; overflow: hidden; text-align: center; }
.padw small { display: block; font-size: 11.5px; }
.padw .touch { position: absolute; width: 44px; height: 44px; margin: -22px; border-radius: 50%; background: color-mix(in oklab, var(--accent), transparent 70%); pointer-events: none;
  animation: touch 520ms cubic-bezier(.2, 0, 0, 1) forwards; }
@keyframes touch { from { scale: .4; opacity: 1; } to { scale: 2.2; opacity: 0; } }
.qchips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.qchip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 999px; background: var(--s2); color: var(--bright);
  font-size: 12.5px; font-weight: 600; white-space: nowrap; flex: none; }
.qchip svg { width: 16px; height: 16px; }

/* ── sliders: native range on top, a drawn fill and thumb under it ─────────────────────── */
.slide { position: relative; height: 52px; border-radius: var(--r2); background: var(--s2); overflow: hidden; --v: .5; flex: 1; min-width: 0; }
.slide .fill { position: absolute; inset: 0; background: color-mix(in oklab, var(--accent), transparent 62%); transform-origin: 0 50%; scale: var(--v) 1;
  transition: scale 380ms var(--spring); }
.slide .thumb { position: absolute; top: 0; bottom: 0; left: 0; width: 6px; border-radius: 3px; background: var(--accent);
  translate: calc(var(--v) * (var(--w, 300px) - 6px)) 0; transition: translate 380ms var(--spring), scale 220ms var(--pop); }
.slide.dragging .fill, .slide.dragging .thumb { transition: scale 220ms var(--pop); }
.slide.grab .thumb { scale: 2 .82; }
.slide .ticks { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 2px 6px; pointer-events: none; }
.slide .ticks i { width: 2px; height: 6px; border-radius: 1px; background: color-mix(in oklab, var(--bright), transparent 72%); }
.slide input { -webkit-appearance: none; appearance: none; position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; background: transparent; cursor: ew-resize; opacity: 0; }
.slide input:focus-visible { opacity: 1; outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r2); }
.slide input::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 52px; }
.slidelab, .slideval { position: absolute; top: 50%; translate: 0 -50%; pointer-events: none; font-weight: 600; color: var(--bright); }
.slidelab { left: 16px; display: flex; align-items: center; gap: 8px; }
.slidelab svg { width: 18px; height: 18px; }
.slideval { right: 16px; font: 600 12px var(--mono); transition: scale 220ms var(--pop); }
.slide.grab .slideval { scale: 1.18; color: var(--accent); }
.volrow { display: flex; align-items: center; gap: 8px; }
.iconbtn.muted { color: var(--bad); background: color-mix(in oklab, var(--bad), transparent 86%); }

/* ── COMPUTER PAGE ────────────────────────────────────────────────────────────────────── */
.cbar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 4px; height: calc(56px + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) 8px 0; background: color-mix(in oklab, var(--s0), transparent 100%); transition: background var(--dur) var(--ease); }
.cbar.solid { background: var(--s0); box-shadow: 0 1px 0 var(--line); }
.cbar .iconbtn { color: var(--bright); }
.cbtitle { font: 700 17px var(--display); color: var(--bright); opacity: 0; translate: 0 8px; transition: opacity var(--dur) var(--ease), translate var(--dur-sheet) var(--spring); }
.cbar.solid .cbtitle { opacity: 1; translate: 0 0; }
.cpage { position: relative; z-index: 1; padding: 0 16px calc(32px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; }
.cgrid { display: flex; flex-direction: column; gap: 12px; }
.col { display: contents; }
.o1 { order: 1; } .o2 { order: 2; } .o3 { order: 3; } .o4 { order: 4; } .o5 { order: 5; } .o6 { order: 6; }
.sx > .sect:first-child { margin-top: 4px; }
.sx { display: grid; gap: 8px; min-width: 0; }

.hero2 { position: relative; padding: 18px 16px 16px; display: grid; gap: 16px; }
.hero2 .herobg { position: absolute; inset: 0; border-radius: var(--r4); background: var(--s1); border: 1px solid var(--line); transform-origin: 0 0; overflow: hidden; }
.hero2 .herobg .wash { position: absolute; inset: 0;
  background: linear-gradient(135deg, color-mix(in oklab, var(--hue), transparent 76%), color-mix(in oklab, var(--base0E), transparent 90%) 70%); }
.hero2 > *:not(.herobg) { position: relative; }
.hrow { display: flex; align-items: center; gap: 14px; min-width: 0; }
.hrow .disc { width: 64px; height: 64px; transform-origin: 0 0; }
.hrow .disc svg { width: 28px; height: 28px; }
.hname { margin: 0; font: 700 30px/1.05 var(--display); letter-spacing: -.025em; color: var(--bright); transform-origin: 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hsub { font: 12px var(--mono); color: var(--dim); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hmeta { display: grid; grid-template-columns: 1.25fr 1fr .8fr; gap: 8px; }
.hcell { background: color-mix(in oklab, var(--s0), transparent 35%); border-radius: var(--r2); padding: 9px 10px 8px; min-width: 0; text-align: left; display: grid; gap: 2px; align-content: start; }
.hcell .k { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.hcell .v { font: 600 17px/1.15 var(--display); color: var(--bright); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.hcell .v small { font: 500 11px var(--body); color: var(--dim); }
.hcell .s { font-size: 11.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hcell.tone-ok .v { color: var(--good); } .hcell.tone-warn .v { color: var(--caution); } .hcell.tone-bad .v { color: var(--bad); }
.hcell .lstate { font: inherit; }
button.hcell:active { scale: .97; }
.explain { margin-top: -16px; height: auto; max-height: 0; display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--dur-sheet) var(--spring); }
.explain.open { grid-template-rows: 1fr; margin-top: -6px; max-height: 200px; }
.explain > p { overflow: hidden; min-height: 0; margin: 0; font-size: 12.5px; line-height: 1.55; color: var(--text); }
.explain.open > p { padding: 2px 2px 0; }

/* Big actions: the four reasons you came here. */
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.act { position: relative; display: grid; align-content: space-between; gap: 14px; min-height: 104px; padding: 12px 14px 14px; border-radius: var(--r3);
  background: var(--s2); text-align: left; overflow: hidden; }
.act .aic { width: 42px; height: 42px; border-radius: var(--r2); display: grid; place-items: center; background: var(--s3); color: var(--bright);
  transition: translate 220ms var(--pop), rotate 220ms var(--pop); }
.act:active:not(:disabled) .aic { translate: 0 2px; }
.act b { display: block; font: 700 17px/1.1 var(--display); color: var(--bright); letter-spacing: -.01em; }
.act small { display: block; font-size: 12px; color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.act.primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 10px 30px color-mix(in oklab, var(--accent), transparent 72%); }
.act.primary b, .act.primary small { color: var(--on-accent); }
.act.primary small { opacity: .8; }
.act.primary .aic { background: color-mix(in oklab, var(--on-accent), transparent 84%); color: var(--on-accent); border-radius: 50%; }
.act .badge { position: absolute; top: 12px; right: 12px; font: 600 11px var(--mono); padding: 3px 8px; border-radius: 999px; background: var(--s3); color: var(--bright); }
.act.primary .badge { background: color-mix(in oklab, var(--on-accent), transparent 82%); color: var(--on-accent); }

/* Now playing (mediacard, re-cut: cover crisp on the accent wash; works on light schemes too). */
.np { position: relative; overflow: hidden; border-radius: var(--r4); padding: 14px; display: grid; gap: 12px; color: var(--bright);
  background: linear-gradient(135deg, color-mix(in oklab, var(--accent), var(--s1) 70%), color-mix(in oklab, var(--base0E), var(--s1) 78%)); }
.nptop { display: flex; align-items: center; gap: 14px; min-width: 0; }
.npart { position: relative; width: 92px; height: 92px; flex: none; border-radius: var(--r2); overflow: hidden; box-shadow: 0 8px 24px -6px rgb(0 0 0 / .45); }
.npart i { position: absolute; inset: 0; background-size: cover; transition: opacity 360ms var(--ease), scale 520ms var(--spring); }
.npart i.out { opacity: 0; scale: 1.08; }
.npt { flex: 1; min-width: 0; display: grid; gap: 2px; }
.npt .app { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--text); opacity: .85; }
.npt .app i { width: 14px; height: 14px; border-radius: 4px; background: var(--good); }
.npt b { font: 700 21px/1.15 var(--display); letter-spacing: -.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.npt span.ar { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.npt .swapout { animation: swapout 160ms cubic-bezier(.3, 0, 1, 1) forwards; }
.npt .swapin { animation: swapin 320ms var(--spring) both; }
@keyframes swapout { to { opacity: 0; translate: 0 -8px; } }
@keyframes swapin { from { opacity: 0; translate: 0 10px; } }
.scrub { position: relative; height: 22px; display: flex; align-items: center; }
.scrub .track { position: absolute; left: 0; right: 0; height: 4px; border-radius: 2px; background: color-mix(in oklab, var(--bright), transparent 76%); overflow: hidden; }
.scrub .prog { position: absolute; inset: 0; background: var(--bright); transform-origin: 0 50%; scale: var(--p, 0) 1; }
.scrub .knob { position: absolute; left: 0; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--bright); translate: calc(var(--p, 0) * var(--sw, 300px)) 0; scale: 0;
  transition: scale 200ms var(--pop); }
.scrub:hover .knob, .scrub:active .knob { scale: 1; }
.times { display: flex; justify-content: space-between; font: 10.5px var(--mono); color: var(--text); opacity: .8; margin-top: -10px; }
.npctl { display: flex; align-items: center; gap: 6px; }
.npout { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  background: color-mix(in oklab, var(--bright), transparent 86%); min-width: 0; max-width: 46%; }
.npout span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.npout svg { width: 16px; height: 16px; }
.npbtns { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.npbtns .iconbtn { color: var(--bright); }
.npbtns .iconbtn svg { width: 22px; height: 22px; }
.npplay { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--bright); color: var(--s0); }
.npplay svg { width: 22px; height: 22px; transition: scale 200ms var(--pop), opacity 120ms; }
.npplay.flip svg { scale: .4; opacity: 0; }
.npempty { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: var(--r3); background: var(--s1); color: var(--dim); font-size: 13px; }

/* Quick: two sliders and three toggles (the tile, re-cut vertical for a row of three). */
.qtiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.qt { display: grid; gap: 10px; align-content: start; justify-items: start; min-height: 104px; padding: 12px; border-radius: var(--r3); background: var(--s2); text-align: left; min-width: 0;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease), border-radius 360ms var(--spring), scale var(--dur-press) var(--ease); }
.qt .ic { width: 40px; height: 40px; border-radius: var(--r2); display: grid; place-items: center; background: var(--s3); color: var(--bright);
  transition: background var(--dur) var(--ease), border-radius 360ms var(--spring); }
.qt .ic svg { transition: scale 300ms var(--pop); }
.qt b { display: block; font-size: 13px; font-weight: 600; color: var(--bright); }
.qt small { display: block; font-size: 11.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.qt > span:last-child { min-width: 0; max-width: 100%; }
.qt.on { background: var(--accent); color: var(--on-accent); border-radius: calc(var(--r3) + 8px); }
.qt.on b, .qt.on small { color: var(--on-accent); }
.qt.on .ic { background: color-mix(in oklab, var(--on-accent), transparent 84%); color: var(--on-accent); border-radius: 50%; }
.qt.bump .ic svg { animation: bump 360ms var(--pop); }
@keyframes bump { 40% { scale: .7; } }
.grant { display: grid; gap: 10px; padding: 14px; border-radius: var(--r3); background: color-mix(in oklab, var(--caution), var(--s1) 88%); border: 1px solid color-mix(in oklab, var(--caution), transparent 65%); }
.grant b { color: var(--bright); }
.grant p { margin: 0; font-size: 13px; color: var(--text); }
.cmd { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 12px; border-radius: var(--r1); background: var(--s0); border: 1px solid var(--line); }
.cmd code { flex: 1; font: 12.5px var(--mono); color: var(--bright); overflow-x: auto; white-space: nowrap; }
.offcard { display: grid; gap: 8px; padding: 14px; border-radius: var(--r3); background: color-mix(in oklab, var(--bad), var(--s1) 88%); border: 1px solid color-mix(in oklab, var(--bad), transparent 62%); }
.offcard b { color: var(--bright); } .offcard p { margin: 0; font-size: 13px; color: var(--text); }

/* staggered section entrance */
.cgrid.enter .sx { animation: rise 520ms var(--spring) both; animation-delay: calc(140ms + var(--n) * var(--stagger)); }

/* desktop: two columns */
@media (min-width: 960px) {
  .cpage { max-width: 1080px; padding-inline: 32px; }
  .cbar { padding-inline: max(24px, calc((100% - 1080px) / 2 + 16px)); }
  .cgrid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .col { display: grid; gap: 12px; }
  .hname { font-size: 38px; }
  .hero2 { padding: 22px 20px 20px; }
  .act { min-height: 120px; }
}

/* ── SUB PAGE (Display & session) ─────────────────────────────────────────────────────── */
.spage { padding: 0 16px calc(96px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.phead { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 6px; margin: 0 -8px; padding: calc(6px + env(safe-area-inset-top)) 0 6px; background: var(--s0); }
.phead .iconbtn { color: var(--bright); }
.phead .pt { display: grid; }
.phead .eyebrow { display: inline-flex; align-items: center; gap: 6px; font: 600 10.5px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.phead .eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: var(--hue); }
.phead h3 { margin: 0; font: 700 20px/1.15 var(--display); color: var(--bright); letter-spacing: -.01em; }
.shapes { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -14px; padding-inline: 14px; }
.shape { flex: none; display: grid; justify-items: center; align-content: end; gap: 6px; padding: 10px 8px; min-width: 84px; min-height: 92px;
  border-radius: var(--r2); background: var(--s0); border: 1.5px solid transparent; transition: border-color var(--dur) var(--ease); }
.shape.on { border-color: var(--accent); }
.shape i { display: block; border: 1.5px solid var(--dim); border-radius: 3px; }
.shape.on i { border-color: var(--accent); background: color-mix(in oklab, var(--accent), transparent 80%); }
.shape b { font: 600 11px var(--mono); color: var(--bright); }
.shape small { font-size: 10px; color: var(--dim); }
.applybar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line); background: var(--s1); translate: 0 110%; transition: translate var(--dur-sheet) var(--spring); }
.applybar.on { translate: 0 0; }
.applybar .at { flex: 1; min-width: 0; display: grid; }
.applybar .at span { font-weight: 600; color: var(--bright); }
.applybar .at small { color: var(--dim); font-size: 12px; }
.applybar .btn { width: auto; min-height: 44px; }

/* ── SHEET (host picker) ─────────────────────────────────────────────────────────────── */
.scrim { position: fixed; inset: 0; z-index: 45; background: color-mix(in oklab, #000, transparent 55%); opacity: 0; pointer-events: none; transition: opacity var(--dur-sheet) var(--spring); }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-width: 520px; margin: 0 auto; background: var(--s0); border-top: 1px solid var(--line);
  border-radius: var(--r4) var(--r4) 0 0; padding: 0 16px calc(20px + env(safe-area-inset-bottom)); translate: 0 104%; visibility: hidden;
  transition: translate var(--dur-sheet) var(--spring), visibility 0s linear var(--dur-sheet); box-shadow: 0 -20px 60px rgb(0 0 0 / .35); display: grid; gap: 10px; }
.sheet.on { translate: 0 0; visibility: visible; transition: translate var(--dur-sheet) var(--spring), visibility 0s; }
.grab { height: 22px; display: grid; place-items: center; }
.grab::before { content: ""; width: 38px; height: 5px; border-radius: 3px; background: var(--s3); }
.sheet h3 { margin: 0 4px; font: 700 20px var(--display); color: var(--bright); }
.sheet .why { margin: -4px 4px 4px; font-size: 13px; }
.pickrow .check { margin-left: auto; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--on-accent); background: var(--accent); scale: 0; transition: scale 300ms var(--pop); }
.pickrow.on .check { scale: 1; }
.pickrow .check svg { width: 16px; height: 16px; stroke-width: 2.6; }
.pickrow .navtext small { display: flex; gap: 6px; align-items: center; }

/* ── prototype controls (not part of the design) ─────────────────────────────────────── */
#proto { position: fixed; right: 10px; bottom: 10px; z-index: 99; display: flex; gap: 6px; font: 600 11px var(--body); }
#proto button { padding: 8px 10px; border-radius: 999px; background: color-mix(in oklab, var(--base05), transparent 20%); color: var(--base00); }
.bare #proto { display: none; }

/* ── motion preferences ─────────────────────────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 1ms !important; animation: none !important; }
}
:root[data-motion="off"] *, :root[data-motion="off"] *::before, :root[data-motion="off"] *::after { transition: none !important; animation: none !important; }
</style>

/* FLIP: measure, change, then animate everything from where it was. Transform-only. */

/* Drag to reorder: the lifted widget follows the finger 1:1 (no easing on direct manipulation);
   the others make room on the spring; on release it settles into its slot with a little overshoot. */
let drag = null;
function startDrag(e, el) {
  if (!$("#wlist").classList.contains("editing")) return;
  e.preventDefault();
  const list = $("#wlist"), items = $$(".widget", list);
  const rects = items.map((x) => x.getBoundingClientRect());
  const from = items.indexOf(el), gap = 8, h = rects[from].height + gap;
  drag = { el, items, rects, from, to: from, h, y0: e.clientY, pid: e.pointerId };
  try { el.setPointerCapture(e.pointerId); } catch (_) {}
  el.classList.add("lifted");
  items.forEach((x) => x !== el && x.classList.add("shift"));
  if (navigator.vibrate) navigator.vibrate(8);
  el.addEventListener("pointermove", onDrag);
  el.addEventListener("pointerup", endDrag, { once: true });
  el.addEventListener("pointercancel", endDrag, { once: true });
}
function onDrag(e) {
  if (!drag) return;
  const { el, items, rects, from, h } = drag;
  const dy = e.clientY - drag.y0;
  el.style.translate = `0 ${dy}px`;
  const mid = rects[from].top + rects[from].height / 2 + dy;
  let to = from;
  rects.forEach((r, i) => { if (i < from && mid < r.top + r.height / 2) to = Math.min(to, i); if (i > from && mid > r.top + r.height / 2) to = i; });
  if (to !== drag.to) { drag.to = to; if (navigator.vibrate) navigator.vibrate(4); }
  items.forEach((x, i) => {
    if (x === el) return;
    let s = 0;
    if (from < to && i > from && i <= to) s = -h;
    if (from > to && i >= to && i < from) s = h;
    x.style.translate = `0 ${s}px`;
  });
}
function endDrag() {
  if (!drag) return;
  const { el, items, rects, from, to } = drag;
  el.removeEventListener("pointermove", onDrag);
  // the slot it lands in, measured from where the widget now at `to` started
  const target = to === from ? 0 : (to > from ? rects[to].bottom - rects[from].bottom : rects[to].top - rects[from].top);
  el.classList.remove("lifted"); el.classList.add("settle");
  el.style.translate = `0 ${target}px`;
  const done = () => {
    const list = $("#wlist");
    items.forEach((x) => { x.classList.remove("shift", "settle"); x.style.transition = "none"; x.style.translate = ""; });
    const [w] = WIDGETS.splice(from, 1); WIDGETS.splice(to, 0, w);
    const ref = list.children[to >= from ? to + 1 : to];
    if (to !== from) list.insertBefore(el, to > from ? ref : list.children[to]);
    requestAnimationFrame(() => items.forEach((x) => (x.style.transition = "")));
    drag = null;
  };
  setTimeout(done, reduced() ? 0 : 340);
}

const host = q.get("host") || "framework";
const freeze = (t) => document.getAnimations().forEach((a) => { a.pause(); a.currentTime = t; });
requestAnimationFrame(() => {
  if (state === "widgets") $("#wsect").scrollIntoView({ block: "start" });
  if (state === "computer" || state === "computer2" || state === "sub") openComputer(host, $(`.ccard[data-host="${host}"]`));
  if (state === "computer2") setTimeout(() => { $("#computer").scrollTop = q.has("y") ? +q.get("y") : 420; $("#computer").dispatchEvent(new Event("scroll")); }, 900);
  if (state === "sub") setTimeout(() => openSub(host), 900);
  if (state === "transition") { openComputer(host, $(`.ccard[data-host="${host}"]`)); requestAnimationFrame(() => freeze(+(q.get("t") || 200))); }
  if (state === "edit" || state === "drag" || state === "picker") {
    toggleEdit(); $("#wsect").scrollIntoView({ block: "start" });
    if (state === "picker") setTimeout(() => openPicker("w2"), 600);
    if (state === "drag") setTimeout(() => {
      // a frozen mid-drag: Clipboard lifted and carried up past Volume, Volume making room
      const el = $('.widget[data-id="w3"]'), g = $(".grip", el), r = g.getBoundingClientRect();
      const ev = (t, y) => new PointerEvent(t, { clientX: r.left + 10, clientY: y, pointerId: 1, bubbles: true });
      g.dispatchEvent(ev("pointerdown", r.top + 10)); el.dispatchEvent(ev("pointermove", r.top - 66));
      setTimeout(() => $$(".widget").forEach((w) => w.getAnimations().forEach((a) => a.finish())), 50);
    }, 700);
  }
});
</script>
</body>
</html>
