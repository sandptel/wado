[package]
name = "wado-protocol"
version = "0.0.2"
edition = "2021"
license = "AGPL-3.0-only"
description = "Shared wire types between the wado server and its clients."

[dependencies]
serde = { version = "1", features = ["derive"] }

# Test-only: the wire-format tests assert the exact JSON the browser hand-writes. The crate
# itself stays serialisation-format agnostic.
[dev-dependencies]
serde_json = "1"

