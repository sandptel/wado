[package]
name = "wado-app-bridge"
version = "0.0.4"
edition = "2021"
license = "AGPL-3.0-only"
description = "The Flutter app's bridge to wado's Rust client core (flutter_rust_bridge). The only crate Dart sees."
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
wado-client-core = { path = "../client-core" }
# Exact: must equal the Dart package `flutter_rust_bridge` and the codegen (docs/app.md).
flutter_rust_bridge = "=2.13.0"
ring = "0.17"
serde_json = "1"
anyhow = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
