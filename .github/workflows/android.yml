# Builds the Android app's debug APK (docs/android.md) and keeps it as an artifact. No secrets:
# release signing happens offline, on the user's machine (docs/android-release.md).
name: android

on:
  push:
    branches: [main]
    paths: ["android/**", "crates/client/**", "crates/protocol/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "crates/client/**", "crates/protocol/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Pinned with the wasm-bindgen pin in crates/client/Cargo.toml (see pages.yml).
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y dioxus-cli@0.7.10

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner's SDK, with the platform and build-tools this app compiles against.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - run: scripts/android-build.sh --debug

      - uses: actions/upload-artifact@v4
        with:
          name: wado-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
