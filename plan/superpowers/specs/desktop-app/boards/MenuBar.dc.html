<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menu bar and tray panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 380px; height: 600px; box-sizing: border-box; padding: 14px; background: #101010; font-family: Figtree, system-ui, sans-serif; font-size: 13px; line-height: 1.45; color: #c8c8c8">
<div style="height: 100%; box-sizing: border-box; background: #1d1d1d; border: 1px solid #333333; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 18px 40px rgba(0,0,0,0.5)">
<div style="display: flex; align-items: center; gap: 10px">
<span style="font-family: 'Bricolage Grotesque', Figtree, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.04em; color: #ececec">wado</span>
<span style="display: inline-flex; align-items: center; gap: 7px; font-weight: 600; color: #e0e0e0"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #a1b56c"></span>Serving</span>
<button type="button" title="Copy the Remote ID" style="margin-left: auto; height: 24px; padding: 0 8px; border: 0; border-radius: 7px; background: #2e2e2e; color: #e0e0e0; font: 400 12px 'JetBrains Mono', monospace; cursor: pointer">482 913 067</button>
</div>
<div style="background: #2a2520; border: 1px solid #5a4630; border-radius: 12px; padding: 8px 12px; display: flex; align-items: center; gap: 10px"><span style="flex-grow: 1; color: #ffffff; font-weight: 600">Allow Accessibility<span style="display: block; font-weight: 400; font-size: 12px; color: #e2d3c4">Phones cannot move the pointer yet</span></span><button type="button" style="height: 28px; padding: 0 10px; border: 0; border-radius: 8px; background: #dc9656; color: #181818; font: 600 12px Figtree, sans-serif; cursor: pointer">Fix</button></div>
<div style="background: #222222; border: 1px solid #2e2e2e; border-radius: 12px; padding: 4px 12px">
<div style="display: flex; align-items: center; gap: 10px; padding: 8px 0"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 999px; background: #a1b56c"></span><div style="flex-grow: 1"><div style="color: #ececec; font-weight: 600">Pixel 9</div><div style="font-size: 12px; color: #9a9a9a">Trackpad · direct</div></div><button type="button" style="height: 28px; padding: 0 10px; border: 0; border-radius: 8px; background: #2e2e2e; color: #e0e0e0; font: 600 12px Figtree, sans-serif; cursor: pointer">Disconnect</button></div>
<div style="display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid #2e2e2e"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 999px; background: #f7ca88"></span><div style="flex-grow: 1"><div style="color: #ececec; font-weight: 600">iPad</div><div style="font-size: 12px; color: #9a9a9a">Files · relayed · and 1 more</div></div><button type="button" style="height: 28px; padding: 0 10px; border: 0; border-radius: 8px; background: #2e2e2e; color: #e0e0e0; font: 600 12px Figtree, sans-serif; cursor: pointer">Disconnect</button></div>
</div>
<div style="background: #222222; border: 1px solid #2e2e2e; border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 8px; background: #3a3340"></span>
<div style="flex-grow: 1; min-width: 0"><div style="color: #ececec; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Weightless</div><div style="font-size: 12px; color: #9a9a9a">Marconi Union</div></div>
<button type="button" aria-label="Pause" style="width: 32px; height: 32px; border: 0; border-radius: 999px; background: #7cafc2; color: #181818; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"></path></svg></button>
</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 0 2px"><div style="flex-grow: 1"><div style="color: #ececec; font-weight: 600">Clipboard sync</div><div style="font-size: 12px; color: #9a9a9a">Last from Pixel 9, 2 min ago</div></div><button type="button" role="switch" aria-checked="true" aria-label="Clipboard sync" style="width: 36px; height: 22px; padding: 2px; border: 0; border-radius: 999px; background: #7cafc2; cursor: pointer; display: flex; justify-content: flex-end"><span style="width: 18px; height: 18px; border-radius: 999px; background: #181818"></span></button></div>
<div style="display: flex; align-items: center; gap: 10px; padding: 0 2px"><div style="flex-grow: 1"><div style="color: #ececec; font-weight: 600">Let devices in</div><div style="font-size: 12px; color: #9a9a9a">Off pauses every device without unpairing</div></div><button type="button" role="switch" aria-checked="true" aria-label="Let devices in" style="width: 36px; height: 22px; padding: 2px; border: 0; border-radius: 999px; background: #7cafc2; cursor: pointer; display: flex; justify-content: flex-end"><span style="width: 18px; height: 18px; border-radius: 999px; background: #181818"></span></button></div>
<div style="flex-grow: 1"></div>
<div style="display: flex; gap: 8px">
<button type="button" style="flex: 1; height: 34px; border: 0; border-radius: 9px; background: #7cafc2; color: #181818; font: 600 13px Figtree, sans-serif; cursor: pointer">Pair a device</button>
<button type="button" style="flex: 1; height: 34px; border: 0; border-radius: 9px; background: #2e2e2e; color: #e0e0e0; font: 600 13px Figtree, sans-serif; cursor: pointer">Open wado</button>
</div>
<button type="button" style="height: 30px; border: 0; border-radius: 9px; background: transparent; color: #e08783; font: 600 12px Figtree, sans-serif; cursor: pointer">Quit — stops serving this computer</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":380,"height":600}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
