<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is not optional here: without it env(safe-area-inset-*) resolves
         to zero and the sheet slides under a phone's home indicator. user-scalable=no stops
         a double-tap on the stream from zooming the page instead of reaching the app. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#181818" />
    <!-- Terminal emulator for the console's shell tab. A PTY sends ANSI — cursor
         addressing, colour, alternate screen — and interpreting that is a real terminal's
         job, not something to hand-roll. Pinned exactly; the fit addon must match the
         xterm it was built against. Loaded here rather than through the JS bridge because
         the bridge is one concatenated eval and cannot await a script tag; js/pty.js
         waits for `window.Terminal` instead of assuming this has finished.
         Integrity-pinned (SRI): this page holds the device's key, so a CDN that served other
         bytes must fail to load rather than run. A version bump needs new hashes:
         curl -sL <url> | openssl dgst -sha384 -binary | openssl base64 -A -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" integrity="sha384-8Xk9wy/gzEDUKrXtrmCFa2bBuK3BpjpDuL/p0SeKQX19Khl/M+lHOgD/CyYf7efP" crossorigin="anonymous" />
    <!-- The shell's faces: a characterful display face for headings, a quiet body face, and a
         mono for numbers and terminals. Every use has a system fallback, so offline is fine. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" />
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js" integrity="sha384-M169f14mRZOXm3hD/v2Ti0ThIT/RnAQagXA9nlE15yHAtrW19gdePJh/HaTzUOe/" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js" integrity="sha384-iF+jqbuti4XlB64clWgFWYEscb+UnSRv3VgVikGYZu+otNFnSHr7y7NcKfBnGizn" crossorigin="anonymous"></script>
    <!-- The file viewer's two libraries, both MIT, both pinned by SRI like xterm above: Plyr, the
         media player's controls (its icon sprite is vendored in js/vendor, not fetched), and
         Panzoom, pinch/wheel zoom for photos. Deferred: nothing needs them until a file opens. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" integrity="sha384-FDFJN4eDoTbFzL8KHLAOmtAicPaFc44D0JrdAwgO91ZDgGmAHrcpMWLCwTxBSVI7" crossorigin="anonymous" />
    <script defer src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.min.js" integrity="sha384-1r2GCX3Eml88xgbJb7kOe51vEASmv6hbqDRcK55GxMiwWy/5xX1xFlC6z7saa8Ct" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.6.0/dist/panzoom.min.js" integrity="sha384-p/V9q47QHNmBI0EG7lJPLVHC5WN1mgpLtNpFykf0IX8iJ4xDCYPWEXcigFOvYW52" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="main"></div>
  </body>
</html>
